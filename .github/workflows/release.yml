name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            plugin_ext: so
            exe_ext: ""
            platform: linux-x86_64
          - os: macos
            runner: macos-latest
            plugin_ext: dylib
            exe_ext: ""
            platform: macos-aarch64
          - os: windows
            runner: windows-latest
            plugin_ext: dll
            exe_ext: .exe
            platform: windows-x86_64
    env:
      IDASDK: ${{ github.workspace }}/ida-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup IDA SDK
        shell: bash
        run: git clone --depth 1 --recurse-submodules https://github.com/HexRaysSA/ida-sdk ida-sdk

      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build build --config Release

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          # Copy plugin
          find "${IDASDK}/src/bin/plugins" -name "eject_plugin.${{ matrix.plugin_ext }}" -exec cp {} dist/ \; 2>/dev/null || \
          find build -name "eject_plugin.${{ matrix.plugin_ext }}" -exec cp {} dist/ \;
          # Copy executable (CMake deploys it to $IDASDK/bin, not build/)
          cp "${IDASDK}/bin/eject_idb${{ matrix.exe_ext }}" dist/ \
            || find build -name "eject_idb${{ matrix.exe_ext }}" -exec cp {} dist/ \;
          # Copy docs
          [ -f README.md ] && cp README.md dist/

      - name: Verify package contents
        shell: bash
        run: |
          test -f "dist/eject_plugin.${{ matrix.plugin_ext }}"
          test -f "dist/eject_idb${{ matrix.exe_ext }}"

      - name: Create archive
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.os }}" = "windows" ]; then
            7z a ../eject_idb-${{ matrix.platform }}.zip *
          else
            zip -r ../eject_idb-${{ matrix.platform }}.zip *
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eject_idb-${{ matrix.platform }}
          path: eject_idb-${{ matrix.platform }}.zip

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          files: artifacts/**/*.zip
          generate_release_notes: true
